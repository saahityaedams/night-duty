<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover, interactive-widget=overlays-content"
    />
    <meta name="theme-color" content="#030406" />
    <meta name="color-scheme" content="dark" />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Night Duty" />
    <meta name="format-detection" content="telephone=no" />
    <link rel="icon" href="data:," />
    <title>Night Duty</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #030406;
        overflow: hidden;
        overscroll-behavior: none;
        touch-action: none;
        -webkit-user-select: none;
        user-select: none;
        -webkit-touch-callout: none;
        -webkit-tap-highlight-color: transparent;
        -webkit-text-size-adjust: 100%;
      }
      /* On phones the stage is the whole screen, edge to edge, under the notch and home bar. */
      #stage {
        position: fixed;
        inset: 0;
        overflow: hidden;
        background: #030406;
      }
      #game {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        display: block;
        touch-action: none;
      }
      /* On laptops and desktops the stage becomes a portrait phone, so the view matches hers exactly. */
      @media (hover: hover) and (pointer: fine) and (min-aspect-ratio: 3/4) {
        body {
          background: radial-gradient(ellipse at 50% 40%, #0c0f15 0%, #020203 70%);
        }
        #stage {
          inset: auto;
          top: 50%;
          left: 50%;
          height: min(94vh, 932px);
          aspect-ratio: 430 / 932;
          transform: translate(-50%, -50%);
          border-radius: 44px;
          box-shadow:
            0 0 0 10px #0b0c0e,
            0 0 0 11px #24262b,
            0 30px 80px rgba(0, 0, 0, 0.8);
        }
      }

      /* --- HUD: icons only, quiet until touched ------------------------------------------- */
      .hud {
        position: absolute;
        inset: 0;
        pointer-events: none;
        transition: opacity 0.6s ease;
      }
      .hud.gone {
        opacity: 0;
      }
      .hud.gone * {
        pointer-events: none !important;
      }
      .hud button {
        pointer-events: auto;
        border: 0;
        padding: 0;
        margin: 0;
        background: none;
        color: rgba(235, 238, 244, 0.82);
        cursor: pointer;
        -webkit-tap-highlight-color: transparent;
        touch-action: none;
      }
      .hud svg {
        width: 24px;
        height: 24px;
        display: block;
      }
      .hidden {
        display: none !important;
      }
      .tool-strip {
        position: absolute;
        left: 50%;
        bottom: calc(env(safe-area-inset-bottom, 0px) + 18px);
        transform: translateX(-50%);
        display: flex;
        gap: 14px;
        padding: 8px 12px;
        border-radius: 32px;
        background: rgba(10, 12, 16, 0.42);
        backdrop-filter: blur(10px);
        -webkit-backdrop-filter: blur(10px);
        box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.06);
      }
      .tool {
        width: 48px;
        height: 48px;
        border-radius: 50%;
        display: grid;
        place-items: center;
        transition:
          background 0.2s,
          color 0.2s,
          transform 0.12s;
      }
      .tool:active {
        transform: scale(0.92);
      }
      .tool.active {
        background: rgba(255, 255, 255, 0.14);
        color: #fff;
        box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.22);
      }
      .look {
        position: absolute;
        top: 46%;
        width: 44px;
        height: 64px;
        display: grid;
        place-items: center;
        color: rgba(235, 238, 244, 0.5);
        background: rgba(10, 12, 16, 0.22);
        border-radius: 14px;
        transition: color 0.2s;
      }
      .look:active {
        color: #fff;
      }
      .look-left {
        left: calc(env(safe-area-inset-left, 0px) + 6px);
      }
      .look-right {
        right: calc(env(safe-area-inset-right, 0px) + 6px);
      }
      /* Hammer charge ring under the finger. */
      .charge-ring {
        position: absolute;
        width: 96px;
        height: 96px;
        margin: -48px 0 0 -48px;
        border-radius: 50%;
        pointer-events: none;
        opacity: 0;
        transform: scale(calc(0.35 + var(--k, 0) * 0.65));
        box-shadow:
          0 0 0 2px rgba(255, 255, 255, calc(0.35 + var(--k, 0) * 0.5)),
          0 0 24px rgba(255, 190, 120, calc(var(--k, 0) * 0.6));
        transition: opacity 0.12s;
      }
      .charge-ring.on {
        opacity: 1;
      }
    </style>
  </head>
  <body>
    <div id="stage"><canvas id="game"></canvas></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
