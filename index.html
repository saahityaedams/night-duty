<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover, interactive-widget=overlays-content"
    />
    <meta name="theme-color" content="#030406" />
    <meta name="color-scheme" content="dark" />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Night Duty" />
    <meta name="format-detection" content="telephone=no" />
    <link rel="icon" type="image/png" href="/icons/favicon-32.png" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <title>Night Duty</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #030406;
        overflow: hidden;
        overscroll-behavior: none;
        touch-action: none;
        -webkit-user-select: none;
        user-select: none;
        -webkit-touch-callout: none;
        -webkit-tap-highlight-color: transparent;
        -webkit-text-size-adjust: 100%;
      }
      /* On phones the stage is the whole screen, edge to edge, under the notch and home bar. */
      #stage {
        position: fixed;
        inset: 0;
        overflow: hidden;
        background: #030406;
      }
      #game {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        display: block;
        touch-action: none;
      }
      /* On laptops and desktops the stage becomes a portrait phone, so the view matches hers exactly. */
      @media (hover: hover) and (pointer: fine) and (min-aspect-ratio: 3/4) {
        body {
          background: radial-gradient(ellipse at 50% 40%, #0c0f15 0%, #020203 70%);
        }
        #stage {
          inset: auto;
          top: 50%;
          left: 50%;
          height: min(94vh, 932px);
          aspect-ratio: 430 / 932;
          transform: translate(-50%, -50%);
          border-radius: 44px;
          box-shadow:
            0 0 0 10px #0b0c0e,
            0 0 0 11px #24262b,
            0 30px 80px rgba(0, 0, 0, 0.8);
        }
      }

      /* Fade in from black once the room is ready. */
      #boot {
        position: absolute;
        inset: 0;
        background: #030406;
        pointer-events: none;
        transition: opacity 1.4s ease;
      }
      #boot.done {
        opacity: 0;
      }

      /* --- HUD: icons only, quiet until touched ------------------------------------------- */
      .hud {
        position: absolute;
        inset: 0;
        pointer-events: none;
        transition: opacity 0.6s ease;
      }
      .hud.gone {
        opacity: 0;
      }
      .hud.gone * {
        pointer-events: none !important;
      }
      .hud button {
        pointer-events: auto;
        border: 0;
        padding: 0;
        margin: 0;
        background: none;
        color: rgba(235, 238, 244, 0.82);
        cursor: pointer;
        -webkit-tap-highlight-color: transparent;
        touch-action: none;
      }
      .hud svg {
        width: 24px;
        height: 24px;
        display: block;
      }
      .hidden {
        display: none !important;
      }
      .tool-strip {
        position: absolute;
        left: 50%;
        bottom: calc(env(safe-area-inset-bottom, 0px) + 18px);
        transform: translateX(-50%);
        display: flex;
        gap: 14px;
        padding: 8px 12px;
        border-radius: 32px;
        background: rgba(10, 12, 16, 0.42);
        backdrop-filter: blur(10px);
        -webkit-backdrop-filter: blur(10px);
        box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.06);
      }
      .tool {
        width: 48px;
        height: 48px;
        border-radius: 50%;
        display: grid;
        place-items: center;
        transition:
          background 0.2s,
          color 0.2s,
          transform 0.12s;
      }
      .tool:active {
        transform: scale(0.92);
      }
      .tool.active {
        background: rgba(255, 255, 255, 0.14);
        color: #fff;
        box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.22);
      }
      .look {
        position: absolute;
        top: 46%;
        width: 44px;
        height: 64px;
        display: grid;
        place-items: center;
        color: rgba(235, 238, 244, 0.5);
        background: rgba(10, 12, 16, 0.22);
        border-radius: 14px;
        transition: color 0.2s;
      }
      .look:active {
        color: #fff;
      }
      .look-left {
        left: calc(env(safe-area-inset-left, 0px) + 6px);
      }
      .look-right {
        right: calc(env(safe-area-inset-right, 0px) + 6px);
      }
      /* Hammer charge ring under the finger. */
      .charge-ring {
        position: absolute;
        width: 96px;
        height: 96px;
        margin: -48px 0 0 -48px;
        border-radius: 50%;
        pointer-events: none;
        opacity: 0;
        transform: scale(calc(0.35 + var(--k, 0) * 0.65));
        box-shadow:
          0 0 0 2px rgba(255, 255, 255, calc(0.35 + var(--k, 0) * 0.5)),
          0 0 24px rgba(255, 190, 120, calc(var(--k, 0) * 0.6));
        transition: opacity 0.12s;
      }
      .charge-ring.on {
        opacity: 1;
      }
      /* Bat: the swipe streak, and a ghost swipe shown once when the bat unlocks. */
      .swipe-trail {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        pointer-events: none;
      }
      .bat-hint {
        position: absolute;
        left: 18%;
        right: 18%;
        top: 76%;
        height: 0;
        pointer-events: none;
        transition: opacity 0.5s;
      }
      .bat-hint.gone {
        opacity: 0;
      }
      .bat-hint i {
        position: absolute;
        top: -9px;
        left: 0;
        width: 18px;
        height: 18px;
        border-radius: 50%;
        background: rgba(255, 240, 225, 0.85);
        box-shadow: 0 0 18px rgba(255, 200, 150, 0.7);
        animation: bathint 1.8s cubic-bezier(0.5, 0, 0.3, 1) infinite;
      }
      .bat-hint i::after {
        content: '';
        position: absolute;
        right: 9px;
        top: 6px;
        height: 6px;
        width: 0;
        border-radius: 3px;
        background: linear-gradient(90deg, rgba(255, 236, 214, 0), rgba(255, 236, 214, 0.55));
        animation: bathintstreak 1.8s cubic-bezier(0.5, 0, 0.3, 1) infinite;
      }
      @keyframes bathint {
        0% { left: 0; opacity: 0; transform: scale(0.8); }
        15% { left: 0; opacity: 1; transform: scale(1); }
        55% { left: calc(100% - 18px); opacity: 1; }
        75%, 100% { left: calc(100% - 18px); opacity: 0; }
      }
      @keyframes bathintstreak {
        0%, 15% { width: 0; }
        50% { width: 120px; }
        75%, 100% { width: 0; }
      }
      @media (prefers-reduced-motion: reduce) {
        .bat-hint i, .bat-hint i::after { animation-duration: 3.6s; }
      }
      /* The meter: a thin unlabeled bar along the top edge, like a phone charging. */
      .meter {
        position: absolute;
        top: calc(env(safe-area-inset-top, 0px) + 6px);
        left: 18%;
        right: 18%;
        height: 3px;
        border-radius: 2px;
        background: rgba(255, 255, 255, 0.08);
        overflow: hidden;
        pointer-events: none;
        transition: opacity 0.6s;
      }
      .meter i {
        position: absolute;
        inset: 0;
        transform-origin: left;
        transform: scaleX(var(--v, 0));
        background: linear-gradient(90deg, rgba(255, 240, 220, 0.75), rgba(255, 190, 120, 0.95));
        box-shadow: 0 0 10px rgba(255, 190, 120, calc(var(--v, 0) * 0.8));
        transition: transform 0.35s cubic-bezier(0.2, 0.8, 0.2, 1);
      }
      .tool.new {
        animation: newtool 1.4s ease-in-out 3;
      }
      @keyframes newtool {
        50% {
          box-shadow: 0 0 0 6px rgba(255, 200, 140, 0.25), inset 0 0 0 1px rgba(255, 255, 255, 0.5);
        }
      }

      /* --- Ending ----------------------------------------------------------------------------- */
      .ending {
        position: absolute;
        inset: 0;
        display: none;
        flex-direction: column;
        justify-content: flex-end;
        padding: 0 28px calc(env(safe-area-inset-bottom, 0px) + 40px);
        color: #f3eee6;
        font-family: -apple-system, 'SF Pro Text', 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
        background: linear-gradient(180deg, rgba(0, 0, 0, 0) 30%, rgba(8, 6, 5, 0.72) 75%);
        pointer-events: none;
      }
      .ending.on {
        display: flex;
      }
      .ending .stats {
        transition: opacity 1.2s;
      }
      .ending .stats.dim {
        opacity: 0.35;
      }
      .ending .row {
        display: flex;
        justify-content: space-between;
        font-size: 17px;
        font-weight: 300;
        letter-spacing: 0.01em;
        padding: 7px 0;
        border-bottom: 1px solid rgba(255, 255, 255, 0.08);
        opacity: 0;
        transform: translateY(6px);
        transition:
          opacity 0.7s,
          transform 0.7s;
      }
      .ending .row.in {
        opacity: 1;
        transform: none;
      }
      .ending .row .value {
        font-variant-numeric: tabular-nums;
        font-weight: 400;
      }
      .ending .row.last {
        border: 0;
        margin-top: 22px;
        font-size: 26px;
        font-weight: 300;
      }
      .ending .message {
        margin-top: 28px;
        font-size: 18px;
        line-height: 1.5;
        font-weight: 300;
        white-space: pre-line;
        opacity: 0;
        transition: opacity 2s;
      }
      .ending .message.in {
        opacity: 1;
      }
      .ending .signature {
        margin-top: 12px;
        opacity: 0.7;
      }
      .ending .choices {
        display: flex;
        gap: 12px;
        margin-top: 30px;
        opacity: 0;
        transition: opacity 1s;
        pointer-events: auto;
      }
      .ending .choices.in {
        opacity: 1;
      }
      .ending .choice {
        flex: 1;
        min-height: 50px;
        border-radius: 14px;
        border: 1px solid rgba(255, 255, 255, 0.28);
        background: rgba(255, 255, 255, 0.04);
        color: #f3eee6;
        font: inherit;
        font-size: 16px;
        cursor: pointer;
      }
      .ending .choice.primary {
        background: rgba(255, 236, 214, 0.9);
        color: #1a1410;
        border-color: transparent;
      }
      .ending .hint {
        margin-top: 14px;
        font-size: 12px;
        line-height: 1.4;
        opacity: 0;
        color: rgba(243, 238, 230, 0.55);
        transition: opacity 1.4s;
      }
      .ending .hint.in {
        opacity: 1;
      }
      .ending.night {
        justify-content: center;
        align-items: center;
        background: rgba(2, 2, 3, 0.97);
        transition: background 3s;
      }
      .goodnight {
        font-size: 22px;
        font-weight: 300;
        letter-spacing: 0.04em;
        opacity: 0;
        transition: opacity 3s;
      }
      .goodnight.in {
        opacity: 0.85;
      }
      .blackout {
        position: absolute;
        inset: 0;
        background: #000;
        opacity: 0;
        transition: opacity 0.9s;
        pointer-events: none;
      }
      .blackout.in {
        opacity: 1;
      }
      .returning {
        position: absolute;
        left: 0;
        right: 0;
        top: calc(env(safe-area-inset-top, 0px) + 22px);
        text-align: center;
        font-family: -apple-system, 'Segoe UI', Roboto, sans-serif;
        font-size: 13px;
        font-weight: 300;
        color: rgba(243, 238, 230, 0.7);
        opacity: 0;
        transition: opacity 1.5s;
        pointer-events: none;
      }
      .returning.in {
        opacity: 1;
      }
    </style>
  </head>
  <body>
    <div id="stage"><canvas id="game"></canvas><div id="boot"></div></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
